# Справка по опциям: https://github.com/lowlighter/metrics/blob/v3.34/action.yml
name: Metrics
on:
  # Раз в сутки в 06:00 по Екатеринбургу (UTC+5)
  schedule: [{cron: "0 1 * * *"}]
  # Запуск вручную и на каждый пуш в main
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Версия закреплена: плавающий @latest может молча сломать workflow
      - uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics.svg
          # Ваш GitHub-токен (секрет METRICS_TOKEN)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: ichinya
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Yekaterinburg
          plugin_gists: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_lines: yes
          # plugin_traffic и plugin_habits убраны: они меняются каждый день,
          # из-за этого бот коммитил SVG ежедневно и засорял историю.
          # Вернуть можно, добавив строки plugin_traffic: yes / plugin_habits: yes
